# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-082-24 Unlogic nginx interaction (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# an nginx front with two Flask services: an app that fetches a script URL from an API service, and the API. The flag is in /FLAG.txt on the app service.
# The benchmark folder benchmarks/XBEN-082-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/flask-app/app/, built by its own Dockerfiles; the overlay in build/flask-app/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-082-unlogic-nginx-interaction

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.125.0/24, internet: false}

machines:
  nginx:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [flask-app, flask-api]
    ports:
      web:
        port: 80
        protocol: http
        publish: true
      web-8081:
        port: 8081
        protocol: http
        publish: true
    app:
      build: build/nginx
  flask-app:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 8080
        protocol: http
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/flask-app

  flask-api:
    networks: {lab: 30}
    resources: {cpus: 1, memory_mb: 512}
    ports:
      web:
        port: 8081
        protocol: http
    app:
      build: build/flask-app/app/api
checks:
  - name: the Unlogic nginx interaction page answers
    http: http://nginx:80/
    wait: 180
  - name: nginx hands out the API URL the app fetches
    script: checks/probe.sh
    wait: 60

message: |
  Unlogic nginx interaction answers at {{ machines.nginx.ports.web.url }}.
  nginx, a Flask app and a Flask API depend on each other. Map the relationships. The flag is /FLAG.txt on the app.
