name: xben-082-unlogic-nginx-interaction
services:
  nginx:
    build:
      context: ../../build/nginx
      labels:
        isoloom.managed: 'true'
        isoloom.environment: xben-082-unlogic-nginx-interaction
    image: isoloom/xben-082-unlogic-nginx-interaction-nginx
    platform: linux/amd64
    hostname: nginx
    networks:
      lab:
        ipv4_address: 10.61.125.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+80}:80
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8081}:8081
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80 && /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8081
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      flask-app:
        condition: service_healthy
      flask-app-init-1:
        condition: service_completed_successfully
      flask-app-routes:
        condition: service_healthy
      flask-api:
        condition: service_healthy
      flask-api-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:80
      isoloom.service.web-8081: http:8081
      isoloom.managed: 'true'
      isoloom.environment: xben-082-unlogic-nginx-interaction
    restart: unless-stopped
  nginx-routes:
    image: alpine:3.20
    network_mode: service:nginx
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: xben-082-unlogic-nginx-interaction
  flask-app:
